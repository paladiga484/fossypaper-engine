name: Idea
description: Something fossypaper should do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like, and why
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: The two rules
      description: fossypaper opens no listening socket and has no telemetry. Ideas that need either won't be taken.
      options:
        - label: This doesn't need a local server, port, daemon or phone-home
          required: true
