[project]
name = "fossypaper-engine"
version = "0.3.0"
description = "A FOSS Wallpaper Engine manager for Linux — scenes, video and stills as a real wallpaper on Hyprland, niri, sway, KDE Plasma, GNOME and X11."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PySide6", "Pillow"]

[project.urls]
Homepage = "https://github.com/paladiga484/fossypaper-engine"

[project.scripts]
fossypaper = "fossypaper.cli:main"
lazypaper = "fossypaper.tui:entry"

[tool.setuptools.packages.find]
include = ["fossypaper*"]

[tool.setuptools.package-data]
fossypaper = ["qml/*.qml"]


[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
