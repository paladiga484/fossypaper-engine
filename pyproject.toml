[project]
name = "fossypaper-engine"
version = "0.3.0"
description = "A wallpaper manager for Wayland — Wallpaper Engine scenes, video and stills, with a browser and per-wallpaper controls."
requires-python = ">=3.10"
dependencies = ["PySide6", "Pillow"]

[project.scripts]
fossypaper = "fossypaper.cli:main"
lazypaper = "fossypaper.tui:main"

[tool.setuptools]
packages = ["fossypaper"]

[tool.setuptools.package-data]
fossypaper = ["qml/*.qml"]


[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
